# platform-crossplane.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-crossplane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Seixeiroo/idp.git
    targetRevision: main
    path: Poc/kubernetes/base/crossplane
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
