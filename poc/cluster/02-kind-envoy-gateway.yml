# install
# helm install eg oci://docker.io/envoyproxy/gateway-helm \
#    --version v1.8.3 -n envoy-gateway-system --create-namespace
# kubectl wait --timeout=5m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available

apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-proxy-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: JSONMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  targetPort: 10080
                  nodePort: 30080
                  protocol: TCP
                - name: https-443
                  port: 443
                  targetPort: 10443
                  nodePort: 30443
                  protocol: TCP # NodePort:30080
